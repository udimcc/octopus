<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Octopus mascot 1 — teal multitasker on dark tile</title>
  <defs>
    <linearGradient id="m1-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181d26"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <radialGradient id="m1-body" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#7ef0e2"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#139c8b"/>
    </radialGradient>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="96" fill="url(#m1-tile)" stroke="#2a3140" stroke-width="4"/>

  <!-- free-curling tentacles -->
  <g fill="none" stroke="#17a596" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M195,305 C175,340 155,365 168,388 C174,400 190,402 200,392"/>
    <path d="M317,305 C337,340 357,365 344,388 C338,400 322,402 312,392"/>
    <path d="M282,322 C290,360 302,390 290,410 C286,422 272,426 264,418"/>
  </g>

  <!-- tentacle reaching up-left to the terminal -->
  <path d="M160,262 C120,250 82,240 72,222" fill="none" stroke="#17a596" stroke-width="28" stroke-linecap="round"/>
  <!-- tentacle reaching up-right to the laptop -->
  <path d="M352,262 C392,250 430,240 440,222" fill="none" stroke="#17a596" stroke-width="28" stroke-linecap="round"/>
  <!-- tentacle reaching down to the git branch -->
  <path d="M230,322 C222,355 216,378 222,398" fill="none" stroke="#17a596" stroke-width="28" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="256" cy="220" r="105" fill="url(#m1-body)" stroke="#0f8a7c" stroke-width="5"/>

  <!-- eyes -->
  <circle cx="222" cy="210" r="16" fill="#0e1116"/>
  <circle cx="290" cy="210" r="16" fill="#0e1116"/>
  <circle cx="227" cy="204" r="5" fill="#ffffff"/>
  <circle cx="295" cy="204" r="5" fill="#ffffff"/>

  <!-- small smile -->
  <path d="M238,240 Q256,250 274,240" fill="none" stroke="#0a3630" stroke-width="5" stroke-linecap="round"/>

  <!-- tiny terminal prop -->
  <rect x="38" y="190" width="66" height="48" rx="8" fill="#0e1116" stroke="#5eead4" stroke-width="3"/>
  <path d="M52,206 L68,214 L52,222" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="219" width="16" height="5" rx="2" fill="#5eead4"/>

  <!-- tiny laptop prop -->
  <rect x="408" y="186" width="62" height="40" rx="4" fill="#0e1116" stroke="#5eead4" stroke-width="3"/>
  <rect x="412" y="190" width="54" height="30" rx="2" fill="#0a4a42"/>
  <path d="M398,230 L480,230 L488,244 L390,244 Z" fill="#5eead4"/>

  <!-- git-branch prop -->
  <g stroke="#5eead4" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="222" y1="395" x2="222" y2="432"/>
    <path d="M222,406 Q238,406 248,414"/>
  </g>
  <circle cx="222" cy="392" r="8" fill="#5eead4"/>
  <circle cx="222" cy="435" r="8" fill="#5eead4"/>
  <circle cx="250" cy="416" r="8" fill="#5eead4"/>
</svg>
