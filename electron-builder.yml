appId: final.octopus
productName: Octopus
copyright: Copyright © Final

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**
  - package.json
  # electron-vite's `?asset` import (src/main/window.ts) compiles to
  # `path.join(__dirname, '../../resources/icon.png')` — i.e. it expects
  # `resources/` to ship at the SAME relative position to `out/main` inside the
  # package as it has in the repo, not to be copied/rewritten. Packing it here
  # (rather than via `extraResources`, which lands outside app.asar at a
  # different relative depth) keeps that join resolving correctly; `nativeImage`
  # (what the `icon` option uses under the hood) reads a path inside an asar
  # archive natively — no fs patching involved, it understands asar paths itself.
  - resources/**

# Native modules (node-pty, better-sqlite3) are prepared for Electron's ABI by our
# own `postinstall` (scripts/rebuild-natives.mjs), NOT by electron-builder. This
# MUST stay false: electron-builder's rebuild would try to COMPILE against
# Electron 33's node-headers, which are not on the air-gapped Artifactory mirror
# (verified 404). Instead we ship node-pty compiled from source (it is N-API, so
# ABI-stable) and better-sqlite3 as its official prebuilt electron-v130 binary.
npmRebuild: false

# The `octopusd` daemon (§6.2) ships as `out/main/daemon.js` (packed into
# `app.asar`, part of `out/**` above) and is launched detached on the bundled
# Electron binary via ELECTRON_RUN_AS_NODE=1. It require()s node-pty at runtime,
# exactly as the main process does.
# asar is ENABLED (electron-builder's default). Its smartUnpack detects native
# modules (any package containing a `.node`) and extracts them to
# `app.asar.unpacked/` automatically — verified: `node-pty/build/Release/pty.node`
# and `better-sqlite3/build/Release/better_sqlite3.node` both land there, so both
# the main process and the daemon load them from the unpacked tree (a `.node`
# cannot be dlopen'd from inside the archive). If a native dep is ever renamed or
# vendored such that smartUnpack misses it, pin it explicitly with
# `asarUnpack: ['**/node_modules/node-pty/**', '**/node_modules/better-sqlite3/**']`.

# Air-gapped: Electron's own binary comes from the internal Artifactory mirror,
# not GitHub. @electron/get appends "v<ver>/electron-v<ver>-<platform>-<arch>.zip".
electronDownload:
  mirror: https://rt-isp.israel.final/artifactory/github-remote/electron/electron/releases/download/

# V0 ships only the unpacked "dir" target: it needs no extra helper binaries
# (AppImage/deb builders fetch those from GitHub, which is unreachable). Packaged
# installers are a V1+ concern gated on a verified ELECTRON_BUILDER_BINARIES_MIRROR.
linux:
  # Pin the launcher name: without this it defaults to `productName` ("Octopus"),
  # a capitalized name the release script and install symlink would have to special-
  # case. `octopus` keeps the on-disk binary stable, lowercase, and scriptable.
  executableName: octopus
  target:
    - dir
